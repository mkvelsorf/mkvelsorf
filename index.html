<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Velsorf</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.35;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      padding: 36px 28px;
    }

    .name {
      margin: 0 0 32px;
      font-size: 18px;
      cursor: pointer;
      width: fit-content;
    }

    .name:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #000;
      padding: 0;
      margin: 0;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    nav button:hover,
    nav button.active {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /*
      ABOUT / CONTACT DROPDOWNS
    */

    .menu-dropdown {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .dropdown-content {
      display: none;
      margin-top: 8px;
      max-width: 210px;
    }

    .dropdown-content.open {
      display: block;
    }

    .dropdown-content .text {
      font-size: 16px;
      line-height: 1.35;
    }

    main {
      grid-column: 2;
      padding: 36px 48px 64px 20px;
      max-width: 1100px;
    }

    .item {
      width: 100%;
      max-width: 900px;
      margin: 0 0 40px;
    }

    iframe {
      display: block;
      border: 0;
    }

    .album-grid {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: nowrap;
      min-width: max-content;
    }
