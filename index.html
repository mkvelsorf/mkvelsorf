<script>

  const vimeo = id => `
    <div class="vimeo">
      <iframe
        src="https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        allowfullscreen>
      </iframe>
    </div>
  `;

  const vimeoLandscape = id => `
    <div class="vimeo landscape">
      <iframe
        src="https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        allowfullscreen>
      </iframe>
    </div>
  `;

  const soundcloud = (url, cls) => `
    <iframe
      class="${cls}"
      scrolling="no"
      frameborder="no"
      allow="autoplay; encrypted-media"
      src="${url}">
    </iframe>
  `;

  const passwords = {
    theater: "nth2025",
    paradise: "chmparadise22#ep",
    endisnew: "pooltheater5"
  };


  /* PASSWORD GATE */

  const gate = (key, playerHtml) => {

    if (sessionStorage.getItem("mkvelsorf-" + key) === "ok") {
      return playerHtml;
    }

    return `
      <div class="film-gate" data-gate="${key}">
        <form>
          <input
            type="password"
            placeholder="Password"
            aria-label="Password"
            autocomplete="off"
            required
          >
          <button type="submit">Enter</button>
        </form>

        <div class="gate-error" aria-live="polite"></div>
      </div>
    `;
  };


  /* PASSWORD TEXT UNDER EACH VIDEO */

  const passwordLabel = key => `
    <div class="film-password">
      pw: ${passwords[key]}
    </div>
  `;


  /* FILM VIDEOS */

  const theaterVideos = [
    "1123734833",
    "1123735765",
    "1123736991",
    "1123076674",
    "1123079519"
  ].map(id =>
    vimeo(id) + passwordLabel("theater")
  ).join("");


  const paradiseVideos = [
    "775045266",
    "775050707",
    "775059208",
    "775063902"
  ].map(id =>
    vimeo(id) + passwordLabel("paradise")
  ).join("");


  /* SECTIONS */

  const sections = {

    albums: () => `
      <div class="album-grid">

        <div class="item">
          <iframe
            style="border:0;width:350px;height:786px;"
            src="https://bandcamp.com/EmbeddedPlayer/album=629911427/size=large/bgcol=ffffff/linkcol=333333/transparent=true/"
            seamless>
          </iframe>
        </div>

        <div class="item">
          <iframe
            style="border:0;width:350px;height:786px;"
            src="https://bandcamp.com/EmbeddedPlayer/album=2019934638/size=large/bgcol=ffffff/linkcol=333333/transparent=true/"
            seamless>
          </iframe>
        </div>

        <div class="item">
          <iframe
            style="border:0;width:350px;height:654px;"
            src="https://bandcamp.com/EmbeddedPlayer/album=1344477240/size=large/bgcol=ffffff/linkcol=333333/transparent=true/"
            seamless>
          </iframe>
        </div>

      </div>
    `,


    film: () => `
      <div class="film-title">
        Calla Henkel & Max Pitegoff: THEATER, 2025
      </div>

      ${gate("theater", theaterVideos)}

      <div class="film-gap"></div>

      <div class="film-title">
        Calla Henkel & Max Pitegoff: Paradise, 2022
      </div>

      ${gate("paradise", paradiseVideos)}
    `,


    theater: () => `
      <div class="theater-credit">
        Vermont, India dir. Michael Herwitz, New Theater Hollywood, 2026
      </div>

      <div class="item">
        ${soundcloud(
          "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A2291689284%3Fsecret_token%3Ds-Sxzg6dgTxEL&color=%231c181a&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true",
          "sc450"
        )}
      </div>

      <div class="theater-gap"></div>

      <div class="theater-credit">
        The End Is New, dir. Calla Henkel & Max Pitegoff, RedCat, Los Angeles, 2025
      </div>

      ${gate(
        "endisnew",
        vimeoLandscape("1151391936") +
        passwordLabel("endisnew")
      )}
    `,


    install: () => `
      <div class="theater-credit">
        Vejen, Nina Beier, permanent installation, New Aalborg University Hospital, 2026
      </div>

      <div class="item">
        ${soundcloud(
          "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%3A2314642574%3Fsecret_token%3Ds-2LIi9pnM8Qu&color=%231c181a&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true",
          "sc166"
        )}
      </div>

      <div class="theater-credit">
        powerhouse, Nile Koetting, Galerie für Gegenwartskunst, Freiburg, 2025
      </div>

      <div class="item">
        ${soundcloud(
          "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%3A2222266889%3Fsecret_token%3Ds-gFd0FW6YoeJ&color=%232f2a36&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true",
          "sc166"
        )}
      </div>
    `,


    about: () => `
      <div class="text">
        MK Velsorf (b. 1991) is a guitarist and composer based in Los Angeles.
        He is educated from Malmö Art Academy, The Cooper Union School of Art,
        New York City, and California Institute of the Arts School of Music.
        He is the music director at New Theater Hollywood.
      </div>
    `,


    contact: () => `
      <div class="text contact">

        <div class="contact-line">
          <a href="mailto:mk@newtheaterhollywood.com">
            mk@newtheaterhollywood.com
          </a>
        </div>

        <div class="contact-line">
          <a
            href="https://www.instagram.com/mkvelsorf/?hl=en"
            target="_blank"
            rel="noopener noreferrer">
            @mkvelsorf
          </a>
        </div>

      </div>
    `
  };


  const content = document.getElementById("content");


  function renderSection(name) {
    content.innerHTML = sections[name]();
    bindGates();
  }


  function bindGates() {

    content.querySelectorAll(".film-gate form").forEach(form => {

      form.addEventListener("submit", event => {

        event.preventDefault();

        const gateEl = form.closest(".film-gate");
        const key = gateEl.dataset.gate;

        const input = form.querySelector("input");
        const error = gateEl.querySelector(".gate-error");

        if (input.value.trim() === passwords[key]) {

          sessionStorage.setItem(
            "mkvelsorf-" + key,
            "ok"
          );

          const activeButton = document.querySelector(
            "nav button.active"
          );

          if (activeButton) {
            renderSection(activeButton.dataset.s);
          }

        } else {

          error.textContent = "Incorrect password";
          input.select();

        }

      });

    });

  }


  document.querySelectorAll("nav button").forEach(button => {

    button.addEventListener("click", () => {

      document.querySelectorAll("nav button").forEach(b => {
        b.classList.remove("active");
      });

      button.classList.add("active");

      renderSection(button.dataset.s);

    });

  });

</script>
