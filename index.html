
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Velsorf</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:fixed;width:260px;height:100vh;padding:36px 28px}
.name{margin:0 0 32px;font-size:18px}nav{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
button{appearance:none;border:0;background:none;color:#000;padding:0;margin:0;font:inherit;cursor:pointer;text-align:left}button:hover,button.active{text-decoration:underline;text-underline-offset:3px}
main{grid-column:2;padding:36px 48px 64px 20px;max-width:1100px}.item{width:100%;max-width:900px;margin:0 0 40px}.item:last-child{margin-bottom:0}
iframe{display:block;border:0}.album-grid{display:flex;gap:24px;align-items:flex-start;flex-wrap:nowrap}.bandcamp{width:350px;height:786px}.opening{height:654px}
.vimeo{position:relative;width:100%;max-width:900px;aspect-ratio:4/3;margin-bottom:40px}.vimeo.landscape{aspect-ratio:16/9}.vimeo iframe{position:absolute;inset:0;width:100%;height:100%}
.sc166{width:100%;height:166px}.sc450{width:100%;height:450px}.theater-credit{font-size:16px;margin:0 0 16px}.theater-gap{height:5cm}.film-gate{max-width:900px;margin:0 0 40px}.film-gate form{display:flex;gap:8px;margin-top:8px}
.film-gate input{font:inherit;border:1px solid #000;padding:4px 6px;background:#fff;color:#000}
.film-gate button{font:inherit;border:0;background:#000;color:#fff;padding:5px 9px;cursor:pointer}
.gate-error{margin-top:8px}.text{max-width:620px}.contact a{color:#000;text-decoration:none}.contact a:hover{text-decoration:underline;text-underline-offset:3px}
@media(max-width:700px){.album-grid{flex-direction:column;gap:28px}.layout{display:block}.sidebar{position:relative;width:100%;height:auto;padding:24px 20px 10px}.name{margin-bottom:22px}nav{flex-direction:row;flex-wrap:wrap;gap:7px 18px}main{padding:28px 20px 48px}.bandcamp{width:100%;max-width:350px}}
</style></head>
<body><div class="layout"><aside class="sidebar"><div class="name">MK Velsorf</div>
<nav><button data-s="albums">Album releases</button><button data-s="film">Film scores</button><button data-s="theater">Theater scores</button><button data-s="install">Art installation scores</button><button data-s="about">About</button><button data-s="contact">Contact</button></nav></aside>
<main><div id="content"></div></main></div>
<script>
const V=id=>`<div class="vimeo"><iframe src="https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479" allow="autoplay;fullscreen;picture-in-picture;clipboard-write;encrypted-media;web-share" allowfullscreen></iframe></div>`;
const VL=id=>`<div class="vimeo landscape"><iframe src="https://player.vimeo.com/video/${id}?badge=0&autopause=0&player_id=0&app_id=58479" allow="autoplay;fullscreen;picture-in-picture;clipboard-write;encrypted-media;web-share" allowfullscreen></iframe></div>`;
const SC=(u,c)=>`<iframe class="${c}" scrolling="no" frameborder="no" allow="autoplay;encrypted-media" src="${u}"></iframe>`;
const A=`
<div class="album-grid"><div class="item"><iframe class="bandcamp" src="https://bandcamp.com/EmbeddedPlayer/album=629911427/size=large/bgcol=ffffff/linkcol=333333/transparent=true/" seamless></iframe></div>
<div class="item"><iframe class="bandcamp" src="https://bandcamp.com/EmbeddedPlayer/album=2019934638/size=large/bgcol=ffffff/linkcol=333333/transparent=true/" seamless></iframe></div>
<div class="item"><iframe class="bandcamp opening" src="https://bandcamp.com/EmbeddedPlayer/album=1344477240/size=large/bgcol=ffffff/linkcol=333333/transparent=true/" seamless></iframe></div></div>`;
const filmGate = (key, label, videos) => {
  const stored = sessionStorage.getItem("mkvelsorf-" + key) === "ok";
  const players = videos.map(V).join("");
  return stored ? players : `
    <div class="film-gate" data-gate="${key}">
      <div>Please enter password</div>
      <form>
        <input type="password" autocomplete="current-password" aria-label="${label} password">
        <button type="submit">Enter</button>
      </form>
      <div class="gate-error" aria-live="polite"></div>
    </div>`;
};

const F = `
  ${filmGate("theater", "THEATER", ["1123734833","1123735765","1123736991","1123076674","1123079519"])}
  <div style="height:40px"></div>
  ${filmGate("paradise", "Paradise", ["775045266","775050707","775059208","775063902"])}
`;
const T=`
<div class="theater-credit">Vermont, India dir. Michael Herwitz, New Theater Hollywood, 2026</div>
<div class="item">${SC("https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A2291689284%3Fsecret_token%3Ds-Sxzg6dgTxEL&color=%231c181a&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true","sc450")}</div>
<div class="theater-gap"></div>
${VL("1151391936")}`;
const I=`
<div class="theater-credit">Vejen, Nina Beier, permanent installation, New Aalborg University Hospital, 2026</div>
<div class="item">${SC("https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%3A2314642574%3Fsecret_token%3Ds-2LIi9pnM8Qu&color=%231c181a&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true","sc166")}</div>
<div class="theater-credit">powerhouse, Nile Koetting, Galerie für Gegenwartskunst, Freiburg, 2025</div>
<div class="item">${SC("https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%3A2222266889%3Fsecret_token%3Ds-gFd0FW6YoeJ&color=%232f2a36&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true","sc166")}</div>`;
const S={albums:A,film:F,theater:T,install:I,about:`<div class="text">MK Velsorf (b. 1991) is a guitarist and composer based in Los Angeles. He is educated from Malmö Art Academy, The Cooper Union School of Art, New York City, and California Institute of the Arts School of Music. He is the music director at New Theater Hollywood.</div>`,contact:`<div class="text contact"><a href="mailto:mk@newtheaterhollywood.com">mk@newtheaterhollywood.com</a></div>`};
const c=document.getElementById("content");
function bindGates(){
  c.querySelectorAll(".film-gate form").forEach(form=>{
    form.addEventListener("submit", e=>{
      e.preventDefault();
      const gate=form.closest(".film-gate");
      const key=gate.dataset.gate;
      const password=form.querySelector("input").value;
      const expected=key==="theater" ? "nth2025" : "chmparadise22#ep";
      if(password===expected){
        sessionStorage.setItem("mkvelsorf-"+key,"ok");
        c.innerHTML=S.film;
        bindGates();
      } else {
        gate.querySelector(".gate-error").textContent="Incorrect password";
        form.querySelector("input").select();
      }
    });
  });
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  c.innerHTML=S[b.dataset.s];
  bindGates();
});
</script></body></html>
